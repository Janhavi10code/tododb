<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster - Premium To-Do</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-container">
        <header>
            <h1>TaskMaster</h1>

        </header>

        <main>
            <form id="task-form">
                <input type="text" id="task-title" placeholder="Task Title" required>
                <input type="text" id="task-desc" placeholder="Description">
                <input type="datetime-local" id="task-time" required>
                <button type="submit" class="btn primary">Add Task</button>
            </form>

            <div class="task-list" id="tasks-container">
                <!-- Tasks will be injected here via JS -->
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>

</html>
